<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette - CodeNameX0</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <h1>🎰 Wheel of Fortune</h1>
        <p class="creator">Created by <span class="highlight">CodeNameX0</span></p>
    </header>

    <!-- 결과 모달 -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎉 결과</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="modalResult" class="result-text"></div>
                <div class="confetti"></div>
            </div>
            <div class="modal-footer">
                <button id="spinAgain" class="modal-btn primary">다시 돌리기</button>
                <button id="removeWinner" class="modal-btn danger">당첨 항목 삭제</button>
                <button id="closeModal" class="modal-btn">닫기</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 항목 관리 패널 -->
        <div class="panel">
            <h2>항목 관리</h2>
            <div class="input-section">
                <input type="text" id="itemInput" placeholder="새 항목 입력..." maxlength="20">
                <button id="addButton">추가</button>
            </div>
            <div class="items-list">
                <h3>현재 항목들:</h3>
                <ul id="itemsList"></ul>
            </div>
            <div class="controls">
                <button id="clearAll">모두 삭제</button>
                <button id="resetDefault">기본값 복원</button>
            </div>
        </div>

        <!-- 룰렛 -->
        <div class="roulette-section">
            <div class="roulette-container">
                <canvas width="380" height="380"></canvas>
                <div id="pointer"></div>
            </div>
            <button id="spinButton">Spin</button>
            <div id="result"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
